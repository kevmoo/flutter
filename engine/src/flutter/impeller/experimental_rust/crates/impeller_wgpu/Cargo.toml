[package]
name = "impeller_wgpu"
version.workspace = true
edition.workspace = true

[dependencies]
impeller_geometry.workspace = true
impeller_path.workspace = true
impeller_core.workspace = true
impeller_tessellator.workspace = true
impeller_typographer.workspace = true
bytemuck.workspace = true
image.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0", default-features = false, features = [
    "webgpu",
    "webgl",
    "wgsl",
    "fragile-send-sync-non-atomic-wasm",
] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[dev-dependencies]
approx.workspace = true
