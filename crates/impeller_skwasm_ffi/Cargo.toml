[package]
name = "impeller_skwasm_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
impeller_geometry.workspace = true
impeller_path.workspace = true
impeller_core.workspace = true
impeller_tessellator.workspace = true
impeller_typographer = { path = "../impeller_typographer", default-features = false }
impeller_wgpu.workspace = true
impeller_canvas.workspace = true
wgpu.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
impeller_typographer = { path = "../impeller_typographer", features = ["embedded-fonts"] }
wasm-bindgen-cli-support.workspace = true
pollster.workspace = true
