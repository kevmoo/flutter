[package]
name = "impeller_interop_c"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
impeller_geometry.workspace = true
impeller_path.workspace = true
impeller_core.workspace = true
impeller_tessellator.workspace = true
impeller_typographer = { path = "../impeller_typographer", default-features = false }
impeller_wgpu.workspace = true
impeller_canvas.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
impeller_typographer = { path = "../impeller_typographer", features = ["embedded-fonts"] }

[dev-dependencies]
approx.workspace = true
